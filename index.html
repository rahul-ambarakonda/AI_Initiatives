<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Initiatives</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>AI Initiatives</h1>
            <p>Technology Transformation - Digital Engineering and Quality</p>
        </div>
    </header>

    <main>
        <section id="projects" class="projects-section">
            <h2>Our Projects</h2>
            <div class="project-cards-container">
                <!-- Project cards will be inserted here by JavaScript -->
            </div>
        </section>

        <section id="contact" class="contact-section">
            <h2>Contact Us for a Demo</h2>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>
                <button type="submit" class="cta-button">Submit</button>
            </form>
        </section>
    </main>

    <div id="project-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 KPMG. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
